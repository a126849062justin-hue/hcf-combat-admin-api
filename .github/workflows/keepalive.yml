name: keep-alive
# 每 10 分鐘 ping 一次後台,避免 Render 免費版休眠(讓瀏覽追蹤不漏、後台秒開)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # 也可手動觸發
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HCF backend (wake if asleep)
        run: |
          URL="https://hcf-admin.onrender.com/api/public/content"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "awake ✅"; exit 0; fi
            sleep 20
          done
          echo "still not 200 after retries"; exit 0
